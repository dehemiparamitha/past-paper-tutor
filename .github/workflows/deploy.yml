name: CI/CD Pipeline

on:
  push:
    branches: [ main, feature/aws-deployment ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Continuous Integration (Build & Code Validation)
  ci:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Frontend Type-check & Build
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend (Typecheck & Vite Build)
        working-directory: ./frontend
        env:
          VITE_API_URL: http://localhost:8000
        run: npm run build

      # Backend Validation
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Backend Code
        run: |
          python -m compileall backend/app

  # Job 2: Continuous Deployment (EC2 SSH & Docker Rebuild)
  deploy:
    name: Deploy to EC2
    needs: ci
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/aws-deployment') && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: SSH and Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            TARGET="${{ secrets.TARGET_DIR }}"
            if [ -z "$TARGET" ]; then
              TARGET="~/past-paper-tutor"
            fi
            
            cd "$TARGET"
            echo "Current directory: $(pwd)"

            echo "Pulling latest code from GitHub..."
            git pull

            echo "Rebuilding and updating backend & frontend services..."
            docker compose up -d --build backend frontend

            echo "Cleaning up dangling Docker images..."
            docker image prune -f

            echo "Deployment completed successfully!"
